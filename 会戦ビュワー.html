<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>会戦ビュワー: S星系外縁</title>
<style>
  body { margin:0; font-family:"Yu Gothic UI","Meiryo",sans-serif; background:#f4f5f7; color:#222; }
  #wrap { display:flex; gap:12px; padding:12px; }
  #left { flex:0 0 820px; }
  #right { flex:1; min-width:340px; }
  canvas { background:#fff; border:1px solid #bbb; border-radius:6px; display:block; }
  h1 { font-size:16px; margin:0 0 8px; }
  .box { background:#fff; border:1px solid #ccc; border-radius:6px; padding:8px 10px; margin-bottom:10px; font-size:13px; }
  .box h2 { font-size:13px; margin:0 0 6px; }
  .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .row label { flex:0 0 150px; }
  .row input[type=number] { width:64px; }
  .bar { height:10px; background:#e5e7eb; border-radius:5px; overflow:hidden; flex:1; }
  .bar > div { height:100%; width:0; }
  #log { height:190px; overflow:auto; font-size:12px; line-height:1.5; }
  #log .on { background:#fff3c4; }
  #log .past { color:#555; }
  #log .future { color:#aaa; }
  #ctl { display:flex; align-items:center; gap:8px; margin-top:8px; }
  #slider { flex:1; }
  button { padding:3px 10px; }
  .note { color:#666; font-size:12px; }
  #result { font-weight:bold; }
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <h1>会戦ビュワー: S星系外縁（単位: 光分。T=0 は人類増援の到着）</h1>
    <canvas id="cv" width="820" height="520"></canvas>
    <div id="ctl">
      <button id="play">再生</button>
      <input id="slider" type="range" min="0" max="240" step="1" value="0">
      <span id="tlabel" style="width:90px;text-align:right"></span>
      <select id="speed">
        <option value="2">低速</option>
        <option value="6" selected>中速</option>
        <option value="15">高速</option>
      </select>
    </div>
    <p class="note">数値は仮置き。配置・時刻は確定済みの設定から。損耗は簡易モデル（右のパラメータ）で計算した推定値で、戦闘の描写そのものではない。人類は到着後、H2から数万kmの地点へジャンプする（地図上は見えるよう拡大表示）。</p>
  </div>
  <div id="right">
    <div class="box">
      <h2>シナリオ</h2>
      <div class="row"><button id="scA">A 人類勝ち（後続が延伸先端で待機）</button></div>
      <div class="row"><button id="scB">B ザイレン勝ち（後続をH2に温存）</button></div>
      <div class="note">下のパラメータを変えると結果が変わる。</div>
    </div>
    <div class="box">
      <h2>パラメータ</h2>
      <div class="row"><label>ザイレン H2在艦</label><input id="pZin" type="number" value="30"></div>
      <div class="row"><label>ザイレン 後続</label><input id="pZback" type="number" value="50"></div>
      <div class="row"><label>後続の置き場</label>
        <select id="pPlace"><option value="lane">延伸の先端</option><option value="H2">H2に温存</option></select></div>
      <div class="row"><label>ザイレンの反応時間(分)</label><input id="pR" type="number" value="20"></div>
      <div class="row"><label>人類 ノード艦</label><input id="pN" type="number" value="3"></div>
      <div class="row"><label>人類 ガード級</label><input id="pG" type="number" value="24"></div>
      <div class="row"><label>展開が崩れる敵数</label><input id="pThr" type="number" value="40"></div>
      <div class="note">反応時間: 人類到着を検知してから、後続がH2へ戻るまで。妨害場の展開(15分)より短いと後続が間に合う。</div>
    </div>
    <div class="box">
      <h2>進捗</h2>
      <div class="row"><label>ロックタイム</label><div class="bar"><div id="b1" style="background:#2b6cb0"></div></div></div>
      <div class="row"><label>レーン延伸</label><div class="bar"><div id="b2" style="background:#dd6b20"></div></div></div>
      <div class="row"><label>通信艦 再同期</label><div class="bar"><div id="b3" style="background:#6b46c1"></div></div></div>
      <div class="row"><label>妨害場 展開</label><div class="bar"><div id="b4" style="background:#2f855a"></div></div></div>
    </div>
    <div class="box" id="stat"></div>
    <div class="box">
      <h2>経過</h2>
      <div id="log"></div>
    </div>
    <div class="box"><span id="result"></span></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const OX = 230, OY = 290, SC = 62;
const P = {base:[0,0], H2:[5,0], P0:[5,2], H1:[-1.7,-1.0], FIELD_R:3.0, NEWFIELD_R:1.3};
const px = (x,y) => [OX + x*SC, OY - y*SC];

function params() {
  return {
    Zin:+$("pZin").value, Zback:+$("pZback").value, place:$("pPlace").value, R:+$("pR").value,
    N0:+$("pN").value, G0:+$("pG").value, thr:+$("pThr").value,
    kz:0.012, q:2.0, loss:0.01, ward:2.0,
    lockDur:45, extStart:5, extDur:80, comm:15, deploy:15
  };
}

function simulate(p) {
  const T = 240;
  const st = [], ev = [];
  const add = (t, s) => ev.push({t, s});
  let N = p.N0, G = p.G0, S = 1;
  let Zin = p.Zin, Zb = p.Zback;
  let backJoined = false;
  const nearAtDeploy = p.Zin + ((p.place === "H2" || p.R <= p.deploy) ? p.Zback : 0);
  const success = nearAtDeploy <= p.thr;
  const fieldDone = success ? 45 + p.deploy : null;
  const sLostAt = success ? null : 45 + 8;
  const joinAt = success ? null : ((p.place === "H2") ? 45 : 45 + Math.min(p.R, p.deploy));
  const combatEnd = 45 + p.lockDur;

  add(0, "人類増援が到着（H2から約2光分）。ロックタイム45分開始");
  add(2, "ザイレンが光学観測で気づく（光速遅延2分）");
  add(p.extStart, "エルダ級がレーン延伸を開始（2光分で約" + p.extDur + "分）");
  add(p.comm, "通信艦の再同期が完了。議会との通信が復帰");
  add(45, "ロックタイム明け。人類がH2の数万kmへジャンプ。静穏場艦が展開開始（ロックタイム再開）");
  if (success) add(fieldDone, "妨害場の展開完了。H2が閉鎖され、後続はH2に入れない");
  else add(sLostAt, "展開中の静穏場艦が集中攻撃で撃沈。妨害場は張れない（H2付近の敵 " + nearAtDeploy + " > " + p.thr + "）");
  if (!success && p.place !== "H2") add(joinAt, "後続がレーンで引き返し、交戦に加わる");
  add(p.extStart + p.extDur, "延伸が人類の元の位置に到達");

  let ended = false;
  for (let t = 0; t <= T; t++) {
    const inCombat = t >= 45 && t < combatEnd && !ended;
    if (inCombat) {
      if (!success && t >= sLostAt) S = 0;
      if (!backJoined && joinAt !== null && t >= joinAt) backJoined = true;
      const active = Zin + (backJoined ? Zb : 0);
      if (active <= 0.5) { ended = true; }
      else {
        const Ph = (6*N + G) * p.q;
        const dz = Math.min(active, p.kz * Ph);
        const fromIn = Math.min(Zin, dz);
        Zin -= fromIn;
        if (backJoined) Zb -= (dz - fromIn);
        const dl = active * p.loss / p.ward;
        G = Math.max(0, G - 0.8*dl);
        N = Math.max(0, N - 0.2*dl/4);
      }
    }
    st.push({t, N, G, S, Zin: Math.max(0,Zin), Zb: Math.max(0,Zb), backJoined, success, fieldDone, sLostAt, joinAt});
  }
  const lastS = st[combatEnd];
  const nodesOk = lastS.N >= 2.5;
  const Zleft = lastS.Zin + (lastS.backJoined ? lastS.Zb : 0);
  let result;
  if (success) {
    result = "人類の勝ち: H2を閉鎖し、孤立した敵" + p.Zin + "隻を撃破。人類の損失はガード級約" + (p.G0 - Math.round(lastS.G)) + "隻。ただし後続" + p.Zback + "隻が拠点側へ回り込む（次の段階へ）。";
  } else {
    result = "ザイレンの勝ち: 妨害場が張れず、H2付近の敵" + nearAtDeploy + "隻が殺到。人類はガード級約" + (p.G0 - Math.round(lastS.G)) + "隻、ノード艦約" + (p.N0 - lastS.N).toFixed(1) + "隻分を失う。" + (nodesOk ? "" : "リンクが弱まりロックタイムが延びて一部の艦は離脱できない。") + "ザイレン残存は約" + Math.round(Zleft) + "隻。";
  }
  add(combatEnd, "ロックタイム明け" + (nodesOk ? "" : "（ノード艦不足で一部は離脱不能）"));
  ev.sort((a,b)=>a.t-b.t);
  return {st, ev, success, result, combatEnd, nearAtDeploy, p};
}

let sim = simulate(params());
let t = 0, playing = false, lastTime = 0;

function fmt(m) { const h = Math.floor(m/60), mm = m%60; return "T+" + h + ":" + String(mm).padStart(2,"0"); }
function dot(x, y, r, c) { ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle = c; ctx.fill(); }
function cluster(cx, cy, n, color, spread) {
  const k = Math.max(0, Math.min(80, Math.round(n)));
  for (let i = 0; i < k; i++) {
    const a = i * 2.399, r = spread * Math.sqrt(i / Math.max(1,k));
    dot(cx + r*Math.cos(a), cy + r*Math.sin(a), 2, color);
  }
}
function nearH2Count(s) {
  const closed = sim.success && t >= 45;
  const incl = (s.backJoined || sim.p.place === "H2") && !closed;
  return s.Zin + (incl ? s.Zb : 0);
}

function draw() {
  const s = sim.st[t], p = sim.p;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.font = "10px sans-serif"; ctx.lineWidth = 1;
  for (let x = -3; x <= 9; x++) { const [a] = px(x,0); ctx.strokeStyle = "#eee"; ctx.beginPath(); ctx.moveTo(a,10); ctx.lineTo(a,510); ctx.stroke(); ctx.fillStyle = "#999"; ctx.fillText(x, a+2, 508); }
  for (let y = -4; y <= 4; y++) { const [,b] = px(0,y); ctx.strokeStyle = "#eee"; ctx.beginPath(); ctx.moveTo(10,b); ctx.lineTo(810,b); ctx.stroke(); if (y) { ctx.fillStyle = "#999"; ctx.fillText(y, 12, b-2); } }
  const [bx,by] = px(P.base[0],P.base[1]);
  ctx.beginPath(); ctx.arc(bx,by,P.FIELD_R*SC,0,7); ctx.fillStyle = "rgba(47,133,90,0.08)"; ctx.fill();
  ctx.strokeStyle = "#2f855a"; ctx.setLineDash([6,4]); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  ctx.font = "12px sans-serif";
  ctx.fillStyle = "#2f855a"; ctx.fillText("拠点の妨害場（半径3光分）", bx-60, by+P.FIELD_R*SC+14);
  dot(bx,by,6,"#2b6cb0"); ctx.fillStyle = "#2b6cb0"; ctx.fillText("人類拠点（静穏場艦2・ガード級6）", bx-70, by-12);
  const [h1x,h1y] = px(P.H1[0],P.H1[1]); dot(h1x,h1y,4,"#999"); ctx.fillStyle="#888"; ctx.fillText("H1（寸断済み）", h1x-30, h1y+14);
  const [h2x,h2y] = px(P.H2[0],P.H2[1]);
  dot(h2x,h2y,6,"#dd6b20"); ctx.fillStyle="#dd6b20"; ctx.fillText("H2（ザイレンのハブ）", h2x-50, h2y+22);
  if (s.success && t >= 45) {
    const prog = Math.min(1, (t-45)/p.deploy);
    ctx.beginPath(); ctx.arc(h2x,h2y,P.NEWFIELD_R*SC*prog,0,7);
    ctx.fillStyle = "rgba(47,133,90,0.12)"; ctx.fill(); ctx.strokeStyle="#2f855a"; ctx.setLineDash([5,3]); ctx.stroke(); ctx.setLineDash([]);
    if (prog >= 1) { ctx.fillStyle="#2f855a"; ctx.fillText("H2の妨害場", h2x-30, h2y-P.NEWFIELD_R*SC-6); }
  }
  if (!s.success && s.sLostAt !== null && t >= s.sLostAt) { ctx.fillStyle = "#c53030"; ctx.fillText("妨害場 展開失敗", h2x+16, h2y-14); }
  const extProg = Math.max(0, Math.min(1, (t - p.extStart)/p.extDur));
  const [p0x,p0y] = px(P.P0[0],P.P0[1]);
  const tipx = h2x + (p0x-h2x)*extProg, tipy = h2y + (p0y-h2y)*extProg;
  if (t >= p.extStart) {
    ctx.strokeStyle = "#dd6b20"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(h2x,h2y); ctx.lineTo(tipx,tipy); ctx.stroke();
    dot(tipx,tipy,4,"#dd6b20");
  }
  ctx.fillStyle="#888"; ctx.fillText("到着点（H2から2光分）", p0x+8, p0y-6);
  if (t < 45) { cluster(p0x, p0y, 35, "#2b6cb0", 14); }
  else {
    const hx = h2x+34, hy = h2y+28;
    cluster(hx, hy, s.N + s.G + s.S + 6, "#2b6cb0", 16);
    ctx.fillStyle="#2b6cb0"; ctx.fillText("人類艦隊（H2の数万km、拡大表示）", hx-30, hy+34);
    ctx.strokeStyle="#2b6cb0"; ctx.lineWidth = 1; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(p0x,p0y); ctx.lineTo(hx,hy); ctx.stroke(); ctx.setLineDash([]);
  }
  const near = nearH2Count(s);
  cluster(h2x-8, h2y-4, near, "#dd6b20", 18);
  const outCount = s.Zb - (near - s.Zin);
  if (outCount > 0.5) {
    if (t >= p.extStart + p.extDur) { cluster(p0x+10, p0y+2, outCount, "#dd6b20", 14); ctx.fillStyle="#dd6b20"; ctx.fillText("後続（延伸先に出現、空振り）", p0x-10, p0y-22); }
    else { cluster(tipx, tipy, outCount, "#dd6b20", 12); ctx.fillStyle="#dd6b20"; ctx.fillText("後続（延伸先端で待機）", tipx+12, tipy+4); }
  }
  ctx.fillStyle = "#222"; ctx.font = "bold 16px sans-serif"; ctx.fillText(fmt(t), 700, 30);
  ctx.font = "12px sans-serif";
  dot(26,24,5,"#2b6cb0"); ctx.fillStyle="#222"; ctx.fillText("人類", 36, 28);
  dot(80,24,5,"#dd6b20"); ctx.fillStyle="#222"; ctx.fillText("ザイレン", 90, 28);
}

function bars() {
  const p = sim.p, s = sim.st[t];
  const a = t < 45 ? 0 : 45, b = t < 45 ? 45 : sim.combatEnd;
  const w = (v) => (Math.max(0,Math.min(1,v))*100) + "%";
  $("b1").style.width = w((t-a)/(b-a));
  $("b2").style.width = w((t-p.extStart)/p.extDur);
  $("b3").style.width = w(t/p.comm);
  $("b4").style.width = s.success ? w((t-45)/p.deploy) : "0%";
}
function stat() {
  const s = sim.st[t], near = nearH2Count(s);
  $("stat").innerHTML = "<b>人類</b> ノード艦 " + s.N.toFixed(1) + " / ガード級 " + s.G.toFixed(1) + " / 静穏場艦 " + s.S +
    "<br><b>ザイレン</b> H2付近 " + Math.round(near) + " / 延伸側 " + Math.round(Math.max(0, s.Zb - (near - s.Zin)));
}
function log() {
  let html = "";
  sim.ev.forEach(e => {
    const cls = e.t < t ? "past" : (e.t === t ? "on" : "future");
    html += '<div class="' + cls + '">' + fmt(e.t) + "　" + e.s + "</div>";
  });
  $("log").innerHTML = html;
}
function render() {
  $("slider").value = t; $("tlabel").textContent = fmt(t);
  draw(); bars(); stat(); log();
}
function rerun() { sim = simulate(params()); $("result").textContent = sim.result; render(); }

$("slider").oninput = e => { t = +e.target.value; render(); };
$("play").onclick = () => {
  playing = !playing; $("play").textContent = playing ? "停止" : "再生";
  if (playing && t >= 240) t = 0;
  lastTime = performance.now(); requestAnimationFrame(tick);
};
let acc = 0;
function tick(now) {
  if (!playing) return;
  acc += (now - lastTime)/1000 * (+$("speed").value); lastTime = now;
  if (acc >= 1) { const d = Math.floor(acc); acc -= d; t = Math.min(240, t + d); render(); }
  if (t >= 240) { playing = false; $("play").textContent = "再生"; return; }
  requestAnimationFrame(tick);
}
function setBase(place){ $("pZin").value=30; $("pZback").value=50; $("pPlace").value=place; $("pR").value=20; $("pN").value=3; $("pG").value=24; $("pThr").value=40; rerun(); }
$("scA").onclick = () => setBase("lane");
$("scB").onclick = () => setBase("H2");
["pZin","pZback","pPlace","pR","pN","pG","pThr"].forEach(id => $(id).onchange = rerun);
rerun();
</script>
</body>
</html>
